version: '3'
services:
  spillman-etl:
    build:
      context: .
      dockerfile: Dockerfile
    image: sccity/spillman-etl:prod
    container_name: spillman-etl
    environment:
      - TZ=America/Denver
    env_file:
      - stack.env #For Portainer
    restart: unless-stopped
    user: "1435:1435" 